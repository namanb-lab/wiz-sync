          package com.example.wizsync

          import android.content.Context
          import android.os.SystemClock
          import java.io.BufferedInputStream
          import java.io.BufferedOutputStream
          import java.io.DataInputStream
          import java.io.DataOutputStream
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream

          /** One saved color track: 4 bytes (r, g, b, brightness) for every intervalMs of the video. */
          class Track(
              val id: String,
              val name: String,
              val intervalMs: Int,
              val durationMs: Long,
              val data: ByteArray
          ) {
              val count: Int get() = data.size / 4

              /** Fills out[0..3] = r, g, b, brightness (0..255), blended between the two nearest samples. */
              fun colorAt(posMs: Long, out: FloatArray) {
                  if (count == 0) return
                  val t = posMs.toDouble() / intervalMs
                  val i0 = t.toInt().coerceIn(0, count - 1)
                  val i1 = (i0 + 1).coerceAtMost(count - 1)
                  val f = (t - i0).toFloat().coerceIn(0f, 1f)
                  for (k in 0 until 4) {
                      val a = data[i0 * 4 + k].toInt() and 0xFF
                      val b = data[i1 * 4 + k].toInt() and 0xFF
                      out[k] = a + (b - a) * f
                  }
              }
          }

          class TrackInfo(
              val id: String,
              val name: String,
              val intervalMs: Int,
              val durationMs: Long,
              val sizeBytes: Long
          )

          /** Saved tracks live in the app's private storage on this device. */
          object Tracks {
              private const val MAGIC = 0x575A4331

              private fun dir(ctx: Context): File {
                  val d = File(ctx.filesDir, "tracks")
                  d.mkdirs()
                  return d
              }

              fun save(ctx: Context, name: String, intervalMs: Int, durationMs: Long, data: ByteArray): String {
                  val id = System.currentTimeMillis().toString()
                  DataOutputStream(BufferedOutputStream(FileOutputStream(File(dir(ctx), "$id.wzc")))).use { o ->
                      o.writeInt(MAGIC)
                      o.writeInt(intervalMs)
                      o.writeLong(durationMs)
                      o.writeInt(data.size / 4)
                      o.writeUTF(name)
                      o.write(data)
                  }
                  return id
              }

              fun list(ctx: Context): List<TrackInfo> {
                  val files = dir(ctx).listFiles()?.filter { it.name.endsWith(".wzc") } ?: return emptyList()
                  val out = ArrayList<TrackInfo>()
                  for (f in files) {
                      try {
                          DataInputStream(BufferedInputStream(FileInputStream(f))).use { i ->
                              if (i.readInt() == MAGIC) {
                                  val interval = i.readInt()
                                  val dur = i.readLong()
                                  i.readInt()
                                  val name = i.readUTF()
                                  out.add(TrackInfo(f.name.removeSuffix(".wzc"), name, interval, dur, f.length()))
                              }
                          }
                      } catch (e: Exception) {
                      }
                  }
                  return out.sortedByDescending { it.id }
              }

              fun load(ctx: Context, id: String): Track? {
                  return try {
                      DataInputStream(BufferedInputStream(FileInputStream(File(dir(ctx), "$id.wzc")))).use { i ->
                          if (i.readInt() != MAGIC) {
                              null
                          } else {
                              val interval = i.readInt()
                              val dur = i.readLong()
                              val count = i.readInt()
                              val name = i.readUTF()
                              val data = ByteArray(count * 4)
                              i.readFully(data)
                              fillGaps(data)
                              Track(id, name, interval, dur, data)
                          }
                      }
                  } catch (e: Exception) {
                      null
                  }
              }

              fun delete(ctx: Context, id: String) {
                  File(dir(ctx), "$id.wzc").delete()
                  File(dir(ctx), "$id.cues").delete()
              }

              /** Effect cues are kept in a small text file next to the track: one "ms,kind,auto" line each. */
              fun saveCues(ctx: Context, id: String, cues: List<Cue>) {
                  val sb = StringBuilder()
                  for (c in cues) {
                      sb.append(c.ms).append(',').append(c.kind).append(',').append(if (c.auto) 1 else 0).append('\n')
                  }
                  try {
                      File(dir(ctx), "$id.cues").writeText(sb.toString())
                  } catch (e: Exception) {
                  }
              }

              fun loadCues(ctx: Context, id: String): List<Cue> {
                  val f = File(dir(ctx), "$id.cues")
                  if (!f.exists()) return emptyList()
                  val out = ArrayList<Cue>()
                  try {
                      for (line in f.readLines()) {
                          val p = line.split(',')
                          if (p.size >= 3) {
                              val ms = p[0].toLongOrNull()
                              val kind = p[1].toIntOrNull()
                              if (ms != null && kind != null) out.add(Cue(ms, kind, p[2] == "1"))
                          }
                      }
                  } catch (e: Exception) {
                  }
                  return out
              }

              private fun hasColor(d: ByteArray, i: Int): Boolean {
                  val o = i * 4
                  return d[o].toInt() != 0 || d[o + 1].toInt() != 0 || d[o + 2].toInt() != 0
              }

              private fun copyColor(d: ByteArray, from: Int, to: Int) {
                  d[to * 4] = d[from * 4]
                  d[to * 4 + 1] = d[from * 4 + 1]
                  d[to * 4 + 2] = d[from * 4 + 2]
              }

              /** Dark frames have no color; they keep the last real color so the light doesn't jump. */
              private fun fillGaps(d: ByteArray) {
                  val n = d.size / 4
                  var first = -1
                  for (i in 0 until n) {
                      if (hasColor(d, i)) {
                          first = i
                          break
                      }
                  }
                  if (first < 0) return
                  for (i in 0 until first) copyColor(d, first, i)
                  var last = first
                  for (i in first until n) {
                      if (hasColor(d, i)) {
                          last = i
                      } else {
                          copyColor(d, last, i)
                      }
                  }
              }
          }

          /** The "movie lights" clock. The app screen and the play service both use this. */
          object Player {
              @Volatile var track: Track? = null
              @Volatile var playing = false
              @Volatile var cues: List<Cue> = emptyList()
              @Volatile var cueVersion = 0
              private var baseMs = 0L
              private var baseWall = 0L

              private fun now(): Long = SystemClock.elapsedRealtime()
              private fun dur(): Long = track?.durationMs ?: 0L

              @Synchronized
              fun position(): Long {
                  val p = if (playing) baseMs + (now() - baseWall) else baseMs
                  return p.coerceIn(0L, dur())
              }

              @Synchronized
              fun seek(ms: Long) {
                  baseMs = ms.coerceIn(0L, dur())
                  baseWall = now()
              }

              @Synchronized
              fun nudge(deltaMs: Long) {
                  seek(position() + deltaMs)
              }

              @Synchronized
              fun play() {
                  if (baseMs >= dur()) baseMs = 0L
                  baseWall = now()
                  playing = true
              }

              @Synchronized
              fun pause() {
                  baseMs = position()
                  playing = false
              }

              @Synchronized
              fun load(t: Track) {
                  track = t
                  baseMs = 0L
                  baseWall = now()
                  playing = false
              }

              @Synchronized
              fun clear() {
                  track = null
                  playing = false
                  baseMs = 0L
                  cues = emptyList()
                  cueVersion++
              }
          }

          /** State of the video analysis job, shared between the service and the screen. */
          object Jobs {
              @Volatile var running = false
              @Volatile var cancel = false
              @Volatile var progress = 0f
              @Volatile var title = ""
              @Volatile var startedAt = 0L
              @Volatile var message = ""
              @Volatile var libraryVersion = 0
          }
