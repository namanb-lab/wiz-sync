          package com.example.wizsync

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.os.Build
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import kotlin.math.pow

          /** Works out the "scene color" of one frame from a stream of pixels. */
          class Accum {
              private var wr = 0.0
              private var wg = 0.0
              private var wb = 0.0
              private var ws = 0.0
              private var vsum = 0.0
              private var n = 0

              fun reset() {
                  wr = 0.0
                  wg = 0.0
                  wb = 0.0
                  ws = 0.0
                  vsum = 0.0
                  n = 0
              }

              fun add(pr: Int, pg: Int, pb: Int) {
                  val mx = maxOf(pr, pg, pb)
                  vsum += mx
                  n++
                  // Skip near-black pixels (letterbox bars, deep shadows) so they don't wash out the scene.
                  if (mx < 24) return
                  val mn = minOf(pr, pg, pb)
                  val v = mx / 255.0
                  val sat = (mx - mn).toDouble() / mx
                  // Bright, colorful pixels count the most.
                  val wt = v * v * (0.15 + sat)
                  wr += pr * wt
                  wg += pg * wt
                  wb += pb * wt
                  ws += wt
              }

              /** [r, g, b, brightness], each 0..255. r = g = b = 0 means "no usable color in this frame". */
              fun result(): IntArray {
                  val v = if (n > 0) (vsum / n).toInt().coerceIn(0, 255) else 0
                  if (ws < 0.0001) return intArrayOf(0, 0, 0, v)
                  return intArrayOf(
                      (wr / ws).toInt().coerceIn(0, 255),
                      (wg / ws).toInt().coerceIn(0, 255),
                      (wb / ws).toInt().coerceIn(0, 255),
                      v
                  )
              }
          }

          data class LookParams(
              val minDim: Int,
              val gamma: Float,
              val satBoost: Float,
              val minSat: Float,
              val gainR: Float,
              val gainG: Float,
              val gainB: Float
          )

          /** Color and brightness settings. The sliders in the app write these; live sync and movie lights read them. */
          object Look {
              const val K_MIN_DIM = "minDim"   // 10..100 %
              const val K_BOOST = "boost"      // 0..100  (dark-scene boost)
              const val K_SAT = "sat"          // 0..100  (saturation boost)
              const val K_MIN_SAT = "minSat"   // 0..100 %
              const val K_R = "gainR"          // 40..100 %
              const val K_G = "gainG"
              const val K_B = "gainB"
              const val K_GENTLE = "gentle"    // 0/1: softer, fewer flashes
              const val K_DETECT = "detect"    // 0/1: find lightning/blasts while analyzing
              const val K_SENS = "sens"        // 1..100: detection sensitivity

              private val defaults = mapOf(
                  K_MIN_DIM to 40, K_BOOST to 57, K_SAT to 60, K_MIN_SAT to 70,
                  K_R to 100, K_G to 100, K_B to 80,
                  K_GENTLE to 0, K_DETECT to 1, K_SENS to 50
              )

              private fun prefs(ctx: Context) = ctx.getSharedPreferences("look", Context.MODE_PRIVATE)

              fun get(ctx: Context, key: String): Int = prefs(ctx).getInt(key, defaults.getValue(key))

              fun set(ctx: Context, key: String, value: Int) {
                  prefs(ctx).edit().putInt(key, value).apply()
              }

              fun reset(ctx: Context) {
                  prefs(ctx).edit().clear().apply()
              }

              fun params(ctx: Context): LookParams = LookParams(
                  minDim = get(ctx, K_MIN_DIM).coerceIn(10, 100),
                  gamma = 1f - 0.7f * get(ctx, K_BOOST) / 100f,
                  satBoost = 1f + 2f * get(ctx, K_SAT) / 100f,
                  minSat = get(ctx, K_MIN_SAT).coerceIn(0, 100) / 100f,
                  gainR = get(ctx, K_R) / 100f,
                  gainG = get(ctx, K_G) / 100f,
                  gainB = get(ctx, K_B) / 100f
              )

              class Out(val white: Boolean, val r: Int, val g: Int, val b: Int, val dim: Int)

              /** Turns a scene color (0..255 each) and brightness (0..1) into what the bulb is told. */
              fun compute(p: LookParams, r: Float, g: Float, b: Float, v: Float): Out {
                  val dim = (p.minDim + (100 - p.minDim) * v.coerceIn(0f, 1f).pow(p.gamma)).toInt()
                      .coerceIn(p.minDim, 100)

                  val hsv = FloatArray(3)
                  Color.RGBToHSV(
                      r.toInt().coerceIn(0, 255),
                      g.toInt().coerceIn(0, 255),
                      b.toInt().coerceIn(0, 255),
                      hsv
                  )

                  // Almost no color in the scene: use the white LEDs instead of a washed-out RGB mix.
                  if (hsv[1] < 0.12f) return Out(true, 255, 255, 255, dim)

                  // Keep the hue but send it at full strength with no white component, otherwise the bulb's
                  // red and blue LEDs overpower green and everything looks pink.
                  val sat = (hsv[1] * p.satBoost).coerceIn(p.minSat, 1f)
                  val c = Color.HSVToColor(floatArrayOf(hsv[0], sat, 1f))
                  return Out(
                      false,
                      (Color.red(c) * p.gainR).toInt().coerceIn(0, 255),
                      (Color.green(c) * p.gainG).toInt().coerceIn(0, 255),
                      (Color.blue(c) * p.gainB).toInt().coerceIn(0, 255),
                      dim
                  )
              }

              fun json(o: Out): String =
                  if (o.white) {
                      """{"method":"setPilot","params":{"state":true,"temp":4500,"dimming":${o.dim}}}"""
                  } else {
                      """{"method":"setPilot","params":{"state":true,"r":${o.r},"g":${o.g},"b":${o.b},"dimming":${o.dim}}}"""
                  }

              /** The color a bulb would show for a given scene color, for the preview dots. */
              fun preview(ctx: Context, r: Float, g: Float, b: Float): Int {
                  val o = compute(params(ctx), r, g, b, 1f)
                  return if (o.white) Color.rgb(255, 244, 229) else Color.rgb(o.r, o.g, o.b)
              }
          }

          /** Finds the bulbs once, then sends colors to the ones that are switched on in the app. */
          class Sender(private val ctx: Context) {
              private val sock = DatagramSocket()
              private var targets: List<Pair<String, InetAddress>> = emptyList()

              /** Scans for bulbs (takes a few seconds). Returns how many are switched on for sync. */
              fun refresh(): Int {
                  val list = Wiz.known(10 * 60 * 1000L) ?: Wiz.discover()
                  targets = list.map { it.key to InetAddress.getByName(it.ip) }
                  return active()
              }

              fun active(): Int {
                  val off = Wiz.disabled(ctx)
                  return targets.count { it.first !in off }
              }

              fun total(): Int = targets.size

              fun send(r: Float, g: Float, b: Float, v: Float) {
                  val out = compute(r, g, b, v)
                  val msg = Look.json(out).toByteArray()
                  val off = Wiz.disabled(ctx)
                  for ((key, ip) in targets) {
                      if (key in off) continue
                      try {
                          sock.send(DatagramPacket(msg, msg.size, ip, Wiz.PORT))
                      } catch (e: Exception) {
                      }
                  }
              }

              /** For effects: even-numbered bulbs get color a, odd-numbered get color b (0xRRGGBB, or Fx.W for white). */
              fun sendSplit(a: Int, da: Int, b: Int, db: Int) {
                  val p = Look.params(ctx)
                  val off = Wiz.disabled(ctx)
                  var idx = 0
                  for ((key, ip) in targets) {
                      if (key in off) continue
                      val even = idx % 2 == 0
                      idx++
                      val msg = Fx.json(if (even) a else b, if (even) da else db, p).toByteArray()
                      raw(ip, msg)
                  }
              }

              /** Starts one of the bulb's built-in scenes. */
              fun sendScene(sceneId: Int) {
                  val msg =
                      """{"method":"setPilot","params":{"state":true,"sceneId":$sceneId,"speed":100,"dimming":100}}"""
                          .toByteArray()
                  val off = Wiz.disabled(ctx)
                  for ((key, ip) in targets) {
                      if (key in off) continue
                      raw(ip, msg)
                  }
              }

              private fun raw(ip: InetAddress, msg: ByteArray) {
                  try {
                      sock.send(DatagramPacket(msg, msg.size, ip, Wiz.PORT))
                  } catch (e: Exception) {
                  }
              }

              private fun compute(r: Float, g: Float, b: Float, v: Float): Look.Out =
                  Look.compute(Look.params(ctx), r, g, b, v)

              fun close() {
                  sock.close()
              }
          }

          object Notif {
              private const val CH = "sync"

              fun build(ctx: Context, text: String): Notification {
                  val nm = ctx.getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CH, "WiZ Sync", NotificationManager.IMPORTANCE_LOW)
                  )
                  return Notification.Builder(ctx, CH)
                      .setContentTitle("WiZ Sync")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .build()
              }

              fun update(ctx: Context, id: Int, text: String) {
                  ctx.getSystemService(NotificationManager::class.java).notify(id, build(ctx, text))
              }

              fun startFg(s: Service, id: Int, text: String, type: Int) {
                  if (Build.VERSION.SDK_INT >= 29) {
                      s.startForeground(id, build(s, text), type)
                  } else {
                      s.startForeground(id, build(s, text))
                  }
              }
          }
