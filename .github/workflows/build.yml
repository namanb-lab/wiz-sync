name: Build WiZ Sync APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Write project files
        run: |
          mkdir -p  app app/src/main app/src/main/java/com/example/wizsync app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WizSync"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.wizsync"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.wizsync"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:label="WiZ Sync"
                  android:icon="@mipmap/ic_launcher"
                  android:banner="@drawable/banner"
                  android:theme="@style/Theme.WizSync">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SyncService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".AnalyzeService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <service
                      android:name=".PlayService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.WizSync" parent="Theme.Material3.Dark.NoActionBar">
                  <item name="colorPrimary">#FF8A3D</item>
                  <item name="colorOnPrimary">#1B1100</item>
                  <item name="colorSecondary">#7C5CFF</item>
                  <item name="colorSurface">#171B30</item>
                  <item name="colorSurfaceVariant">#20254A</item>
                  <item name="colorOutline">#3A4066</item>
                  <item name="android:windowBackground">#0E1020</item>
                  <item name="android:statusBarColor">#0E1020</item>
                  <item name="android:navigationBarColor">#0E1020</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#7C5CFF" android:endColor="#FF8A3D" android:angle="315" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:width="62dp" android:height="62dp" android:gravity="center">
                  <shape android:shape="oval">
                      <solid android:color="#55FFFFFF" />
                  </shape>
              </item>
              <item android:width="36dp" android:height="36dp" android:gravity="center">
                  <shape android:shape="oval">
                      <solid android:color="#FFFFFF" />
                  </shape>
              </item>
          </layer-list>
          EOF

          cat > app/src/main/res/drawable/banner.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <gradient android:startColor="#7C5CFF" android:endColor="#FF8A3D" android:angle="315" />
                  </shape>
              </item>
              <item android:width="84dp" android:height="84dp" android:gravity="center">
                  <shape android:shape="oval">
                      <solid android:color="#55FFFFFF" />
                  </shape>
              </item>
              <item android:width="48dp" android:height="48dp" android:gravity="center">
                  <shape android:shape="oval">
                      <solid android:color="#FFFFFF" />
                  </shape>
              </item>
          </layer-list>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          cat > app/src/main/java/com/example/wizsync/MainActivity.kt <<'EOF'
          package com.example.wizsync

          import android.app.Activity
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.OpenableColumns
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.button.MaterialButton
          import com.google.android.material.button.MaterialButtonToggleGroup
          import com.google.android.material.materialswitch.MaterialSwitch
          import com.google.android.material.progressindicator.LinearProgressIndicator
          import com.google.android.material.slider.Slider
          import com.google.android.material.tabs.TabLayout

          class MainActivity : AppCompatActivity() {

              private val ui = Handler(Looper.getMainLooper())
              private val pages = ArrayList<LinearLayout>()

              private lateinit var bulbStatus: TextView
              private lateinit var bulbList: LinearLayout

              private lateinit var analyzeStatus: TextView
              private lateinit var analyzeBar: LinearProgressIndicator
              private lateinit var analyzeBtn: MaterialButton
              private lateinit var cancelBtn: MaterialButton
              private lateinit var libList: LinearLayout
              private lateinit var nowTitle: TextView
              private lateinit var timeLabel: TextView
              private lateinit var seek: Slider
              private lateinit var playBtn: MaterialButton

              private lateinit var effectBtn: MaterialButton
              private lateinit var cueHeader: TextView
              private lateinit var cueList: LinearLayout
              private lateinit var minEdit: EditText
              private lateinit var secEdit: EditText

              private var dragging = false
              private var libShown = -1
              private var cueShown = -1
              private var cuePage = 0
              private var selectedKind = Fx.LIGHTNING
              private var intervalMs = 500

              private val capture =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                      val d = r.data
                      if (r.resultCode == Activity.RESULT_OK && d != null) {
                          val i = Intent(this, SyncService::class.java)
                              .putExtra("code", r.resultCode)
                              .putExtra("data", d)
                          startForegroundService(i)
                      }
                  }

              private val pickVideo =
                  registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                      if (uri != null) startAnalysis(uri)
                  }

              private val refresher = object : Runnable {
                  override fun run() {
                      refreshMovies()
                      ui.postDelayed(this, 500)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // ---- header ----
                  val header = LinearLayout(this)
                  header.orientation = LinearLayout.VERTICAL
                  header.setPadding(dp(22), dp(24), dp(22), dp(22))
                  val headerBg = GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(Pal.accent2, Pal.accent)
                  )
                  headerBg.cornerRadius = dp(26).toFloat()
                  header.background = headerBg
                  header.addView(label("WiZ Sync", 30f, Color.WHITE, true))
                  header.addView(label("Ambient light for your screen, and for movies you can't capture.", 14f, Color.parseColor("#FFF1E6")))
                  val headerLp = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
                  headerLp.bottomMargin = dp(10)
                  header.layoutParams = headerLp

                  // ---- pages ----
                  pages.add(buildBulbs())
                  pages.add(buildLive())
                  pages.add(buildMovies())
                  pages.add(buildLook())

                  val content = LinearLayout(this)
                  content.orientation = LinearLayout.VERTICAL
                  for (p in pages) content.addView(p)
                  val scroll = ScrollView(this)
                  scroll.addView(content)

                  // ---- tabs ----
                  val tabs = TabLayout(this)
                  tabs.tabMode = TabLayout.MODE_SCROLLABLE
                  tabs.setBackgroundColor(Color.TRANSPARENT)
                  tabs.setSelectedTabIndicatorColor(Pal.accent)
                  tabs.setTabTextColors(Pal.sub, Pal.text)
                  for (name in listOf("Bulbs", "Live", "Movie lights", "Look")) {
                      tabs.addTab(tabs.newTab().setText(name))
                  }
                  tabs.addOnTabSelectedListener(object : TabLayout.OnTabSelectedListener {
                      override fun onTabSelected(tab: TabLayout.Tab?) {
                          showPage(tab?.position ?: 0)
                      }

                      override fun onTabUnselected(tab: TabLayout.Tab?) {}
                      override fun onTabReselected(tab: TabLayout.Tab?) {}
                  })

                  val tabsLp = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
                  tabsLp.bottomMargin = dp(8)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Pal.bg)
                  root.setPadding(dp(16), dp(16), dp(16), 0)
                  root.addView(header)
                  root.addView(tabs, tabsLp)
                  root.addView(scroll, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  setContentView(root)

                  showPage(0)
                  scan()
              }

              override fun onResume() {
                  super.onResume()
                  ui.post(refresher)
              }

              override fun onPause() {
                  super.onPause()
                  ui.removeCallbacks(refresher)
              }

              private fun showPage(index: Int) {
                  for ((k, p) in pages.withIndex()) {
                      p.visibility = if (k == index) View.VISIBLE else View.GONE
                  }
              }

              private fun toast(s: String) {
                  Toast.makeText(this, s, Toast.LENGTH_LONG).show()
              }

              // =====================================================================
              // Bulbs
              // =====================================================================

              private fun buildBulbs(): LinearLayout {
                  val box = card("Your bulbs", "WiZ bulbs found on this Wi-Fi. Switch off any bulb you don't want in the sync.")
                  bulbStatus = label("", 15f, Pal.sub)
                  bulbList = LinearLayout(this)
                  bulbList.orientation = LinearLayout.VERTICAL
                  box.body.addView(bulbStatus)
                  box.body.addView(bulbList)
                  box.body.addView(space(14))
                  box.body.addView(btn("Rescan", false) { scan() })
                  return page(box.card)
              }

              private fun scan() {
                  bulbStatus.text = "Scanning for WiZ bulbs..."
                  bulbList.removeAllViews()
                  Thread {
                      val found = Wiz.discover()
                      runOnUiThread { renderBulbs(found) }
                  }.start()
              }

              private fun renderBulbs(found: List<Bulb>) {
                  bulbList.removeAllViews()
                  bulbStatus.text = if (found.isEmpty()) {
                      "No WiZ bulbs found. Check that this device is on the same Wi-Fi and that local communication is allowed in the WiZ app."
                  } else {
                      "${found.size} WiZ bulb(s) found. Switch on = used in sync."
                  }
                  val off = Wiz.disabled(this)

                  found.forEachIndexed { n, b ->
                      val t = tile()

                      val sw = MaterialSwitch(this)
                      sw.text = "Bulb ${n + 1}   ${b.ip}"
                      sw.textSize = 18f
                      sw.setTextColor(Pal.text)
                      sw.isChecked = b.key !in off
                      sw.setOnCheckedChangeListener { _, on -> Wiz.setEnabled(this, b.key, on) }

                      val state = when (b.on) {
                          true -> "On"
                          false -> "Off"
                          else -> "?"
                      }
                      val signal = if (b.rssi != null) "  |  ${b.rssi} dBm" else ""
                      val mac = b.mac.ifEmpty { "?" }
                      val model = b.model.ifEmpty { "?" }
                      val fw = b.fw.ifEmpty { "?" }
                      val info = label(
                          "MAC: $mac\nModel: $model  |  Firmware: $fw\nState: $state$signal",
                          13f,
                          Pal.sub
                      )
                      info.setPadding(0, dp(6), 0, dp(10))

                      val blink = btn("Blink this bulb", false) {
                          val endOn = b.on != false
                          Thread { Wiz.blink(b.ip, endOn) }.start()
                      }

                      t.addView(sw)
                      t.addView(info)
                      t.addView(blink)
                      bulbList.addView(t)
                  }
              }

              // =====================================================================
              // Live sync
              // =====================================================================

              private fun buildLive(): LinearLayout {
                  val box = card(
                      "Live screen sync",
                      "Mirrors this screen's colors onto your bulbs in real time. Great for YouTube and most apps. Protected apps such as Netflix show up black here, so use Movie lights for those."
                  )
                  box.body.addView(
                      row(
                          btn("Start") { startLive() },
                          btn("Stop", false) { stopService(Intent(this, SyncService::class.java)) }
                      )
                  )
                  return page(box.card)
              }

              private fun startLive() {
                  try {
                      val mpm = getSystemService(MediaProjectionManager::class.java)
                      capture.launch(mpm.createScreenCaptureIntent())
                  } catch (e: ActivityNotFoundException) {
                      toast("This device has no screen-capture permission dialog")
                  }
              }

              // =====================================================================
              // Movie lights
              // =====================================================================

              private fun buildMovies(): LinearLayout {
                  // ---- 1) prepare a movie ----
                  val a = card(
                      "Prepare a movie",
                      "Pick a video file stored on this device. The app reads its colors, moment by moment, and saves them. Later you can play those lights next to the same movie on any screen, even in apps that block screen capture."
                  )
                  a.body.addView(label("Detail level", 14f, Pal.sub))
                  a.body.addView(space(6))

                  val group = MaterialButtonToggleGroup(this)
                  group.isSingleSelection = true
                  group.isSelectionRequired = true
                  var defaultId = View.NO_ID
                  for ((lbl, ms) in listOf("1 per sec" to 1000, "2 per sec" to 500, "4 per sec" to 250)) {
                      val b = MaterialButton(this, null, com.google.android.material.R.attr.materialButtonOutlinedStyle)
                      b.text = lbl
                      b.tag = ms
                      b.id = View.generateViewId()
                      group.addView(b)
                      if (ms == 500) defaultId = b.id
                  }
                  group.check(defaultId)
                  group.addOnButtonCheckedListener { g, checkedId, isChecked ->
                      if (isChecked) intervalMs = g.findViewById<View>(checkedId).tag as Int
                  }
                  a.body.addView(group)
                  a.body.addView(space(14))

                  val detect = MaterialSwitch(this)
                  detect.text = "Find lightning and blasts automatically"
                  detect.textSize = 15f
                  detect.setTextColor(Pal.text)
                  detect.isChecked = Look.get(this, Look.K_DETECT) == 1
                  detect.setOnCheckedChangeListener { _, on -> Look.set(this, Look.K_DETECT, if (on) 1 else 0) }
                  a.body.addView(detect)
                  a.body.addView(
                      sliderRow("Detection sensitivity", 1, 100, Look.get(this, Look.K_SENS), { "$it" }) { v ->
                          Look.set(this, Look.K_SENS, v)
                      }
                  )
                  a.body.addView(space(8))

                  analyzeBtn = btn("Choose video and analyze") { chooseVideo() }
                  a.body.addView(analyzeBtn)

                  analyzeStatus = label("", 13f, Pal.sub)
                  analyzeStatus.setPadding(0, dp(10), 0, dp(6))
                  a.body.addView(analyzeStatus)

                  analyzeBar = LinearProgressIndicator(this)
                  analyzeBar.max = 1000
                  analyzeBar.visibility = View.GONE
                  a.body.addView(analyzeBar)

                  cancelBtn = btn("Cancel analysis", false) { Jobs.cancel = true }
                  cancelBtn.visibility = View.GONE
                  a.body.addView(cancelBtn)

                  // ---- 2) saved tracks ----
                  val b = card("Saved tracks", "Light tracks stored on this device.")
                  libList = LinearLayout(this)
                  libList.orientation = LinearLayout.VERTICAL
                  b.body.addView(libList)

                  // ---- 3) play along ----
                  val p = card(
                      "Play along",
                      "Start the movie on your TV and press Play here at the same moment. Use the nudge buttons if the lights run early or late."
                  )
                  nowTitle = label("No track loaded", 17f, Pal.text, true)
                  timeLabel = label("0:00 / 0:00", 14f, Pal.accent, true)
                  p.body.addView(nowTitle)
                  p.body.addView(timeLabel)

                  seek = Slider(this)
                  seek.valueFrom = 0f
                  seek.valueTo = 1000f
                  seek.stepSize = 1f
                  seek.value = 0f
                  seek.addOnChangeListener { _, v, fromUser ->
                      val t = Player.track
                      if (fromUser && t != null) Player.seek((t.durationMs * v / 1000f).toLong())
                  }
                  seek.addOnSliderTouchListener(object : Slider.OnSliderTouchListener {
                      override fun onStartTrackingTouch(slider: Slider) {
                          dragging = true
                      }

                      override fun onStopTrackingTouch(slider: Slider) {
                          dragging = false
                      }
                  })
                  p.body.addView(seek)

                  playBtn = btn("Play") { togglePlay() }
                  p.body.addView(
                      row(
                          playBtn,
                          btn("Stop", false) {
                              Player.pause()
                              Player.seek(0L)
                              stopService(Intent(this, PlayService::class.java))
                          }
                      )
                  )
                  p.body.addView(space(10))
                  p.body.addView(row(nudge("-60s", -60_000L), nudge("-10s", -10_000L), nudge("+10s", 10_000L), nudge("+60s", 60_000L)))
                  p.body.addView(space(6))
                  p.body.addView(row(nudge("-1s", -1_000L), nudge("-0.25s", -250L), nudge("+0.25s", 250L), nudge("+1s", 1_000L)))

                  val e = buildEffects()
                  return page(a.card, b.card, p.card, e)
              }

              // =====================================================================
              // Effects and cues
              // =====================================================================

              private fun numberField(hintText: String): EditText {
                  val f = EditText(this)
                  f.hint = hintText
                  f.inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                  f.setTextColor(Pal.text)
                  f.setHintTextColor(Pal.sub)
                  f.gravity = Gravity.CENTER
                  return f
              }

              private fun compact(text: String, onClick: () -> Unit): MaterialButton {
                  val b = btn(text, false, onClick)
                  b.textSize = 13f
                  b.minWidth = 0
                  b.minimumWidth = 0
                  b.setPadding(dp(2), dp(8), dp(2), dp(8))
                  return b
              }

              private fun buildEffects(): LinearLayout {
                  val e = card(
                      "Effects and cues",
                      "Add light effects at exact moments of the loaded movie. Finding lightning and blasts automatically is done when you analyze a video; you can also add your own here."
                  )
                  e.body.addView(label("Effect", 14f, Pal.sub))
                  effectBtn = btn(Fx.name(selectedKind), false) { chooseEffect() }
                  e.body.addView(effectBtn)
                  e.body.addView(space(8))
                  e.body.addView(
                      row(
                          btn("Fire now") { Effects.fire(this, selectedKind, null) },
                          btn("Mark here") { markHere() }
                      )
                  )
                  e.body.addView(label("Fire now plays it on the bulbs. Mark here saves it at the current movie time.", 12f, Pal.sub))
                  e.body.addView(space(14))

                  e.body.addView(label("Add at a time", 14f, Pal.sub))
                  minEdit = numberField("min")
                  secEdit = numberField("sec")
                  e.body.addView(row(minEdit, secEdit, btn("Add") { addAtTime() }))
                  e.body.addView(space(14))

                  cueHeader = label("No cues yet", 14f, Pal.text, true)
                  e.body.addView(cueHeader)
                  cueList = LinearLayout(this)
                  cueList.orientation = LinearLayout.VERTICAL
                  e.body.addView(cueList)
                  e.body.addView(space(10))
                  e.body.addView(
                      row(
                          compact("Prev") {
                              cuePage = maxOf(0, cuePage - 1)
                              renderCues()
                          },
                          compact("Next") {
                              cuePage++
                              renderCues()
                          },
                          compact("Near now") { jumpCuesToNow() }
                      )
                  )
                  e.body.addView(space(8))
                  e.body.addView(
                      btn("Delete auto-detected cues", false) {
                          CueBook.clearAuto(this)
                          toast("Auto-detected cues removed")
                      }
                  )
                  return page(e.card)
              }

              private fun chooseEffect() {
                  val names = Fx.all.map { Fx.name(it) }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Choose an effect")
                      .setItems(names) { _, i ->
                          selectedKind = Fx.all[i]
                          effectBtn.text = Fx.name(selectedKind)
                      }
                      .show()
              }

              private fun markHere() {
                  if (Player.track == null) {
                      toast("Load a saved track first")
                      return
                  }
                  // People tap a moment after they see it, so save it a little earlier.
                  val ms = maxOf(0L, Player.position() - 300L)
                  CueBook.add(this, Cue(ms, selectedKind, false))
                  toast("Added ${Fx.name(selectedKind)} at ${fmtMs(ms)}")
              }

              private fun addAtTime() {
                  val t = Player.track
                  if (t == null) {
                      toast("Load a saved track first")
                      return
                  }
                  val mm = minEdit.text.toString().toDoubleOrNull() ?: 0.0
                  val ss = secEdit.text.toString().toDoubleOrNull() ?: 0.0
                  val ms = ((mm * 60.0 + ss) * 1000.0).toLong()
                  if (ms < 0L || ms > t.durationMs) {
                      toast("That time is outside this movie")
                      return
                  }
                  CueBook.add(this, Cue(ms, selectedKind, false))
                  toast("Added ${Fx.name(selectedKind)} at ${fmtMs(ms)}")
              }

              private fun jumpCuesToNow() {
                  val pos = Player.position() - 1000L
                  val all = Player.cues
                  var idx = all.indexOfFirst { it.ms >= pos }
                  if (idx < 0) idx = maxOf(0, all.size - 1)
                  cuePage = idx / 15
                  renderCues()
              }

              private fun renderCues() {
                  cueShown = Player.cueVersion
                  cueList.removeAllViews()
                  val all = Player.cues
                  val pageSize = 15
                  val pages = maxOf(1, (all.size + pageSize - 1) / pageSize)
                  cuePage = cuePage.coerceIn(0, pages - 1)
                  val from = cuePage * pageSize
                  val to = minOf(all.size, from + pageSize)
                  cueHeader.text = if (all.isEmpty()) "No cues yet" else "Cues ${from + 1}-$to of ${all.size}"
                  for (k in from until to) {
                      val c = all[k]
                      val tl = tile()
                      val auto = if (c.auto) "  (auto)" else ""
                      tl.addView(label("${fmtMs(c.ms)}   ${Fx.name(c.kind)}$auto", 15f, Pal.text, true))
                      tl.addView(space(6))
                      tl.addView(
                          row(
                              compact("Go") { Player.seek(maxOf(0L, c.ms - 3000L)) },
                              compact("Test") { Effects.fire(this, c.kind, null) },
                              compact("Delete") { CueBook.remove(this, c) }
                          )
                      )
                      cueList.addView(tl)
                  }
              }

              private fun nudge(text: String, deltaMs: Long): MaterialButton {
                  val b = btn(text, false) { Player.nudge(deltaMs) }
                  b.textSize = 13f
                  b.minWidth = 0
                  b.minimumWidth = 0
                  b.setPadding(dp(2), dp(8), dp(2), dp(8))
                  return b
              }

              private fun chooseVideo() {
                  if (Jobs.running) {
                      toast("A video is already being analyzed")
                      return
                  }
                  try {
                      pickVideo.launch(arrayOf("video/*"))
                  } catch (e: ActivityNotFoundException) {
                      toast("This device has no file picker")
                  }
              }

              private fun startAnalysis(uri: Uri) {
                  try {
                      contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  } catch (e: Exception) {
                  }
                  val i = Intent(this, AnalyzeService::class.java)
                  i.data = uri
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  i.putExtra("name", displayName(uri))
                  i.putExtra("interval", intervalMs)
                  startForegroundService(i)
                  Jobs.message = ""
              }

              private fun displayName(uri: Uri): String {
                  var name = "Video"
                  try {
                      val c = contentResolver.query(uri, null, null, null, null)
                      if (c != null) {
                          if (c.moveToFirst()) {
                              val ix = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              if (ix >= 0) name = c.getString(ix).substringBeforeLast('.')
                          }
                          c.close()
                      }
                  } catch (e: Exception) {
                  }
                  return name
              }

              private fun togglePlay() {
                  if (Player.track == null) {
                      toast("Load a saved track first")
                      return
                  }
                  if (Player.playing) {
                      Player.pause()
                  } else {
                      if (!PlayService.running) startForegroundService(Intent(this, PlayService::class.java))
                      Player.play()
                  }
              }

              private fun renderLibrary() {
                  libList.removeAllViews()
                  libShown = Jobs.libraryVersion
                  val items = Tracks.list(this)
                  if (items.isEmpty()) {
                      libList.addView(label("Nothing saved yet. Analyze a video first.", 14f, Pal.sub))
                      return
                  }
                  for (t in items) {
                      val tl = tile()
                      tl.addView(label(t.name, 16f, Pal.text, true))
                      val detail = label(
                          "${fmtDur(t.durationMs)}  |  ${1000 / t.intervalMs} per sec  |  ${t.sizeBytes / 1024} KB",
                          13f,
                          Pal.sub
                      )
                      detail.setPadding(0, dp(2), 0, dp(10))
                      tl.addView(detail)
                      tl.addView(
                          row(
                              btn("Use this track") { loadTrack(t.id) },
                              btn("Delete", false) { deleteTrack(t.id) }
                          )
                      )
                      libList.addView(tl)
                  }
              }

              private fun loadTrack(id: String) {
                  val t = Tracks.load(this, id)
                  if (t == null) {
                      toast("Could not open that track")
                  } else {
                      Player.load(t)
                      CueBook.set(Tracks.loadCues(this, id))
                      cuePage = 0
                      toast("Loaded: ${t.name}")
                  }
              }

              private fun deleteTrack(id: String) {
                  if (Player.track?.id == id) {
                      Player.clear()
                      stopService(Intent(this, PlayService::class.java))
                  }
                  Tracks.delete(this, id)
                  renderLibrary()
              }

              /** Called twice a second while the screen is open. */
              private fun refreshMovies() {
                  if (Jobs.running) {
                      val p = Jobs.progress
                      val elapsed = (SystemClock.elapsedRealtime() - Jobs.startedAt) / 1000f
                      val eta = if (p > 0.02f) "  |  about ${fmtDur(((elapsed / p - elapsed) * 1000).toLong())} left" else ""
                      analyzeStatus.text = "Analyzing ${Jobs.title}: ${(p * 100).toInt()}%$eta"
                      analyzeBar.visibility = View.VISIBLE
                      analyzeBar.setProgressCompat((p * 1000).toInt(), true)
                      cancelBtn.visibility = View.VISIBLE
                      analyzeBtn.isEnabled = false
                  } else {
                      analyzeStatus.text = Jobs.message
                      analyzeBar.visibility = View.GONE
                      cancelBtn.visibility = View.GONE
                      analyzeBtn.isEnabled = true
                  }

                  if (libShown != Jobs.libraryVersion) renderLibrary()
                  if (cueShown != Player.cueVersion) renderCues()

                  val t = Player.track
                  if (t == null) {
                      nowTitle.text = "No track loaded"
                      timeLabel.text = "0:00 / 0:00"
                  } else {
                      nowTitle.text = t.name
                      val pos = Player.position()
                      timeLabel.text = "${fmtDur(pos)} / ${fmtDur(t.durationMs)}"
                      if (!dragging) {
                          val permille = pos * 1000L / maxOf(t.durationMs, 1L)
                          seek.value = permille.toFloat().coerceIn(0f, 1000f)
                      }
                  }
                  playBtn.text = if (Player.playing) "Pause" else "Play"
              }

              // =====================================================================
              // Look (saturation, brightness, color trim)
              // =====================================================================

              private fun buildLook(): LinearLayout {
                  val box = card(
                      "Color and brightness",
                      "Fine-tune how scene colors become bulb colors. Changes apply right away to live sync and movie lights."
                  )

                  // Preview dots: how a few typical scene colors will come out on the bulbs.
                  val samples = listOf(
                      floatArrayOf(235f, 130f, 40f),
                      floatArrayOf(70f, 120f, 80f),
                      floatArrayOf(60f, 90f, 190f),
                      floatArrayOf(190f, 70f, 90f),
                      floatArrayOf(150f, 150f, 150f)
                  )
                  val dotRow = LinearLayout(this)
                  dotRow.orientation = LinearLayout.HORIZONTAL
                  val dotBgs = ArrayList<GradientDrawable>()
                  for (s in samples) {
                      val dot = View(this)
                      val bg = GradientDrawable()
                      bg.shape = GradientDrawable.OVAL
                      dot.background = bg
                      val lp = LinearLayout.LayoutParams(dp(44), dp(44))
                      lp.marginEnd = dp(12)
                      dotRow.addView(dot, lp)
                      dotBgs.add(bg)
                  }
                  fun refreshDots() {
                      for ((k, s) in samples.withIndex()) {
                          dotBgs[k].setColor(Look.preview(this, s[0], s[1], s[2]))
                      }
                  }
                  refreshDots()
                  box.body.addView(label("Preview: fire, forest, blue, rose, gray scenes", 13f, Pal.sub))
                  box.body.addView(space(8))
                  box.body.addView(dotRow)
                  box.body.addView(space(8))

                  fun add(title: String, key: String, from: Int, to: Int) {
                      box.body.addView(
                          sliderRow(title, from, to, Look.get(this, key), { "$it%" }) { v ->
                              Look.set(this, key, v)
                              refreshDots()
                          }
                      )
                  }
                  add("Minimum brightness", Look.K_MIN_DIM, 10, 100)
                  add("Dark-scene boost", Look.K_BOOST, 0, 100)
                  add("Color saturation", Look.K_SAT, 0, 100)
                  add("Minimum color strength", Look.K_MIN_SAT, 0, 100)
                  add("Red level", Look.K_R, 40, 100)
                  add("Green level", Look.K_G, 40, 100)
                  add("Blue level", Look.K_B, 40, 100)

                  box.body.addView(space(10))
                  val gentle = MaterialSwitch(this)
                  gentle.text = "Gentle flashes (safer)"
                  gentle.textSize = 15f
                  gentle.setTextColor(Pal.text)
                  gentle.isChecked = Look.get(this, Look.K_GENTLE) == 1
                  gentle.setOnCheckedChangeListener { _, on -> Look.set(this, Look.K_GENTLE, if (on) 1 else 0) }
                  box.body.addView(gentle)
                  box.body.addView(
                      label(
                          "Fewer, softer flashes for lightning and other effects. Recommended if anyone watching is sensitive to flashing lights.",
                          12f,
                          Pal.sub
                      )
                  )
                  box.body.addView(space(14))
                  box.body.addView(btn("Reset to defaults", false) {
                      Look.reset(this)
                      recreate()
                  })
                  return page(box.card)
              }

              override fun onDestroy() {
                  ui.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }
          }
