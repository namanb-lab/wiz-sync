          object Pal {
              val bg = Color.parseColor("#0E1020")
              val card = Color.parseColor("#171B30")
              val tile = Color.parseColor("#20254A")
              val stroke = Color.parseColor("#2A3057")
              val text = Color.parseColor("#F2F3FA")
              val sub = Color.parseColor("#9AA0C3")
              val accent = Color.parseColor("#FF8A3D")
              val accent2 = Color.parseColor("#7C5CFF")
          }

          fun Context.dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

          fun fmtDur(ms: Long): String {
              val s = ms / 1000
              val h = s / 3600
              val m = (s % 3600) / 60
              val sec = s % 60
              return if (h > 0) String.format("%d:%02d:%02d", h, m, sec) else String.format("%d:%02d", m, sec)
          }

          fun fmtMs(ms: Long): String = fmtDur(ms) + "." + ((ms % 1000) / 100)

          fun Context.label(text: String, size: Float, color: Int = Pal.text, bold: Boolean = false): TextView {
              val t = TextView(this)
              t.text = text
              t.textSize = size
              t.setTextColor(color)
              if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
              return t
          }

          class CardBox(val card: MaterialCardView, val body: LinearLayout)

          /** A rounded dark card with a title (and optional explanation) at the top. */
          fun Context.card(title: String, subtitle: String? = null): CardBox {
              val body = LinearLayout(this)
              body.orientation = LinearLayout.VERTICAL
              body.setPadding(dp(20), dp(18), dp(20), dp(18))

              val c = MaterialCardView(this)
              c.setRadius(dp(22).toFloat())
              c.setCardBackgroundColor(Pal.card)
              c.setCardElevation(0f)
              c.setStrokeColor(Pal.stroke)
              c.setStrokeWidth(dp(1))
              val lp = LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT,
                  ViewGroup.LayoutParams.WRAP_CONTENT
              )
              lp.bottomMargin = dp(14)
              c.layoutParams = lp
              c.addView(body)

              body.addView(label(title, 19f, Pal.text, true))
              if (subtitle != null) {
                  val s = label(subtitle, 13f, Pal.sub)
                  s.setPadding(0, dp(4), 0, dp(10))
                  body.addView(s)
              }
              return CardBox(c, body)
          }

          /** A smaller rounded block inside a card (one bulb, one saved track). */
          fun Context.tile(): LinearLayout {
              val t = LinearLayout(this)
              t.orientation = LinearLayout.VERTICAL
              t.setPadding(dp(16), dp(12), dp(16), dp(12))
              val bg = GradientDrawable()
              bg.setColor(Pal.tile)
              bg.cornerRadius = dp(16).toFloat()
              t.background = bg
              val lp = LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT,
                  ViewGroup.LayoutParams.WRAP_CONTENT
              )
              lp.topMargin = dp(10)
              t.layoutParams = lp
              return t
          }

          fun Context.btn(text: String, primary: Boolean = true, onClick: () -> Unit): MaterialButton {
              val b = if (primary) {
                  MaterialButton(this)
              } else {
                  MaterialButton(this, null, com.google.android.material.R.attr.materialButtonOutlinedStyle)
              }
              b.text = text
              b.setCornerRadius(dp(14))
              b.setOnClickListener { onClick() }
              return b
          }

          fun Context.space(h: Int): View {
              val v = View(this)
              v.layoutParams = LinearLayout.LayoutParams(1, dp(h))
              return v
          }

          /** Puts the given views side by side with equal widths. */
          fun Context.row(vararg views: View): LinearLayout {
              val r = LinearLayout(this)
              r.orientation = LinearLayout.HORIZONTAL
              for ((i, v) in views.withIndex()) {
                  val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  if (i > 0) lp.marginStart = dp(8)
                  r.addView(v, lp)
              }
              return r
          }

          fun Context.page(vararg views: View): LinearLayout {
              val p = LinearLayout(this)
              p.orientation = LinearLayout.VERTICAL
              for (v in views) p.addView(v)
              return p
          }

          /** A titled slider with its current value on the right. Whole numbers only. */
          fun Context.sliderRow(
              title: String,
              from: Int,
              to: Int,
              initial: Int,
              fmt: (Int) -> String,
              onChange: (Int) -> Unit
          ): LinearLayout {
              val head = label(title, 15f, Pal.text)
              val valueLabel = label(fmt(initial), 15f, Pal.accent, true)

              val top = LinearLayout(this)
              top.orientation = LinearLayout.HORIZONTAL
              top.addView(head, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
              top.addView(valueLabel)

              val slider = Slider(this)
              slider.valueFrom = from.toFloat()
              slider.valueTo = to.toFloat()
              slider.stepSize = 1f
              slider.value = initial.coerceIn(from, to).toFloat()
              slider.addOnChangeListener { _, v, fromUser ->
                  valueLabel.text = fmt(v.toInt())
                  if (fromUser) onChange(v.toInt())
              }

              val box = LinearLayout(this)
              box.orientation = LinearLayout.VERTICAL
              box.setPadding(0, dp(8), 0, dp(2))
              box.addView(top)
              box.addView(slider)
              return box
          }
