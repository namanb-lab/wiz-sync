          package com.example.wizsync

          import android.content.Context
          import android.graphics.ImageFormat
          import android.media.Image
          import android.media.MediaCodec
          import android.media.MediaCodecInfo
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.net.Uri
          import java.io.ByteArrayOutputStream

          /** Decodes a video file from start to end and records its scene color every few hundred milliseconds. */
          object Analyzer {
              class Result(val data: ByteArray, val durationMs: Long)

              fun run(ctx: Context, uri: Uri, intervalMs: Int, onProgress: (Float) -> Unit): Result? {
                  val ex = MediaExtractor()
                  var codec: MediaCodec? = null
                  try {
                      ex.setDataSource(ctx, uri, null)
                      var vi = -1
                      for (i in 0 until ex.trackCount) {
                          val m = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME)
                          if (m != null && m.startsWith("video/")) {
                              vi = i
                              break
                          }
                      }
                      if (vi < 0) return null
                      ex.selectTrack(vi)
                      val fmt = ex.getTrackFormat(vi)
                      val mime = fmt.getString(MediaFormat.KEY_MIME) ?: return null
                      val durUs = if (fmt.containsKey(MediaFormat.KEY_DURATION)) fmt.getLong(MediaFormat.KEY_DURATION) else 0L
                      fmt.setInteger(
                          MediaFormat.KEY_COLOR_FORMAT,
                          MediaCodecInfo.CodecCapabilities.COLOR_FormatYUV420Flexible
                      )

                      val c = MediaCodec.createDecoderByType(mime)
                      codec = c
                      c.configure(fmt, null, null, 0)
                      c.start()

                      val info = MediaCodec.BufferInfo()
                      val intervalUs = intervalMs * 1000L
                      val acc = Accum()
                      val out = ByteArrayOutputStream()
                      var nextUs = 0L
                      var inDone = false
                      var outDone = false
                      var failed = false
                      var idle = 0

                      while (!outDone && !Jobs.cancel) {
                          if (!inDone) {
                              val ii = c.dequeueInputBuffer(10_000)
                              if (ii >= 0) {
                                  val buf = c.getInputBuffer(ii)
                                  val n = if (buf != null) ex.readSampleData(buf, 0) else -1
                                  if (n < 0) {
                                      c.queueInputBuffer(ii, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                                      inDone = true
                                  } else {
                                      c.queueInputBuffer(ii, 0, n, ex.sampleTime, 0)
                                      ex.advance()
                                  }
                              }
                          }

                          val oi = c.dequeueOutputBuffer(info, 10_000)
                          if (oi >= 0) {
                              idle = 0
                              if (info.size > 0 && info.presentationTimeUs >= nextUs) {
                                  val img = c.getOutputImage(oi)
                                  val s = if (img != null) frameColor(img, acc) else null
                                  if (img != null) img.close()
                                  if (s == null) {
                                      failed = true
                                      outDone = true
                                  } else {
                                      // One slot per interval; a frame covers every slot up to its own time.
                                      while (nextUs <= info.presentationTimeUs) {
                                          out.write(s[0])
                                          out.write(s[1])
                                          out.write(s[2])
                                          out.write(s[3])
                                          nextUs += intervalUs
                                      }
                                      if (durUs > 0) {
                                          onProgress((info.presentationTimeUs.toFloat() / durUs).coerceIn(0f, 1f))
                                      }
                                  }
                              }
                              c.releaseOutputBuffer(oi, false)
                              if ((info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) outDone = true
                          } else if (inDone) {
                              idle++
                              if (idle > 500) outDone = true
                          }
                      }

                      if (Jobs.cancel || failed || out.size() == 0) return null
                      val dMs = maxOf(durUs / 1000, (out.size() / 4).toLong() * intervalMs)
                      return Result(out.toByteArray(), dMs)
                  } finally {
                      try {
                          codec?.stop()
                      } catch (e: Exception) {
                      }
                      try {
                          codec?.release()
                      } catch (e: Exception) {
                      }
                      ex.release()
                  }
              }

              /** Samples a grid of pixels from one decoded frame. Returns [r, g, b, brightness] or null if unsupported. */
              private fun frameColor(img: Image, acc: Accum): IntArray? {
                  if (img.format != ImageFormat.YUV_420_888) return null
                  val crop = img.cropRect
                  val cw = crop.width()
                  val ch = crop.height()
                  if (cw <= 0 || ch <= 0) return null
                  val pY = img.planes[0]
                  val pU = img.planes[1]
                  val pV = img.planes[2]
                  val bY = pY.buffer
                  val bU = pU.buffer
                  val bV = pV.buffer
                  acc.reset()
                  val gx = 64
                  val gy = 36
                  for (j in 0 until gy) {
                      val y = crop.top + (j * ch + ch / 2) / gy
                      for (i in 0 until gx) {
                          val x = crop.left + (i * cw + cw / 2) / gx
                          val yy = bY.get(minOf(y * pY.rowStride + x * pY.pixelStride, bY.limit() - 1)).toInt() and 0xFF
                          val uu = bU.get(minOf((y / 2) * pU.rowStride + (x / 2) * pU.pixelStride, bU.limit() - 1)).toInt() and 0xFF
                          val vv = bV.get(minOf((y / 2) * pV.rowStride + (x / 2) * pV.pixelStride, bV.limit() - 1)).toInt() and 0xFF
                          val c = 1.164f * (yy - 16)
                          val d = uu - 128
                          val e = vv - 128
                          val r = (c + 1.793f * e).toInt().coerceIn(0, 255)
                          val g = (c - 0.213f * d - 0.533f * e).toInt().coerceIn(0, 255)
                          val b = (c + 2.112f * d).toInt().coerceIn(0, 255)
                          acc.add(r, g, b)
                      }
                  }
                  return acc.result()
              }
          }
          EOF

          cat > app/src/main/java/com/example/wizsync/SyncService.kt <<'EOF'
          package com.example.wizsync

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.SystemClock

          /** Live sync: mirrors whatever is on this screen onto the bulbs. */
          class SyncService : Service() {

              private var projection: MediaProjection? = null
              private var display: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var sender: Sender? = null
              private var thread: HandlerThread? = null

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, flags: Int, startId: Int): Int {
                  val data = i?.getParcelableExtra<Intent>("data")
                  if (i == null || data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  Notif.startFg(this, 1, "Starting...", ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)

                  val t = HandlerThread("wiz-sync").also { it.start() }
                  thread = t
                  val h = Handler(t.looper)

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mpm.getMediaProjection(i.getIntExtra("code", 0), data).also {
                      it.registerCallback(object : MediaProjection.Callback() {
                          override fun onStop() {
                              stopSelf()
                          }
                      }, h)
                  }
                  h.post { begin(h) }
                  return START_NOT_STICKY
              }

              // Runs on the worker thread: find bulbs, then start grabbing frames.
              private fun begin(h: Handler) {
                  val s = Sender(this)
                  sender = s
                  val n = s.refresh()
                  Notif.update(this, 1, "Syncing $n of ${s.total()} bulb(s)")

                  val dm = resources.displayMetrics
                  val w = 96
                  val hh = (w.toFloat() * dm.heightPixels / dm.widthPixels).toInt().coerceAtLeast(8)
                  val rd = ImageReader.newInstance(w, hh, PixelFormat.RGBA_8888, 2)
                  reader = rd

                  val acc = Accum()
                  var sr = -1f
                  var sg = 0f
                  var sb = 0f
                  var sv = -1f
                  var last = 0L

                  rd.setOnImageAvailableListener({ r ->
                      val img = r.acquireLatestImage() ?: return@setOnImageAvailableListener
                      try {
                          val now = SystemClock.uptimeMillis()
                          if (now - last < 100) return@setOnImageAvailableListener // ~10 updates/sec
                          last = now

                          val p = img.planes[0]
                          val buf = p.buffer
                          acc.reset()
                          for (y in 0 until hh) {
                              for (x in 0 until w) {
                                  val o = y * p.rowStride + x * p.pixelStride
                                  acc.add(
                                      buf.get(o).toInt() and 0xFF,
                                      buf.get(o + 1).toInt() and 0xFF,
                                      buf.get(o + 2).toInt() and 0xFF
                                  )
                              }
                          }
                          val res = acc.result()

                          // A frame with no usable color keeps the previous color.
                          if (res[0] != 0 || res[1] != 0 || res[2] != 0) {
                              val cr = res[0].toFloat()
                              val cg = res[1].toFloat()
                              val cb = res[2].toFloat()
                              if (sr < 0) {
                                  sr = cr
                                  sg = cg
                                  sb = cb
                              } else {
                                  sr += (cr - sr) * 0.5f
                                  sg += (cg - sg) * 0.5f
                                  sb += (cb - sb) * 0.5f
                              }
                          }
                          val av = res[3] / 255f
                          sv = if (sv < 0) av else sv + (av - sv) * 0.5f
                          if (sr >= 0) s.send(sr, sg, sb, sv)
                      } finally {
                          img.close()
                      }
                  }, h)

                  display = projection?.createVirtualDisplay(
                      "wiz-sync", w, hh, dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, rd.surface, null, h
                  )
              }

              override fun onDestroy() {
                  display?.release()
                  reader?.close()
                  projection?.stop()
                  sender?.close()
                  thread?.quitSafely()
                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/java/com/example/wizsync/AnalyzeService.kt <<'EOF'
          package com.example.wizsync

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.IBinder
          import android.os.PowerManager
          import android.os.SystemClock

          /** Reads a video file in the background and saves its color track. */
          class AnalyzeService : Service() {

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, flags: Int, startId: Int): Int {
                  if (i == null || Jobs.running) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val uri = i.data
                  if (uri == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val name = i.getStringExtra("name") ?: "Video"
                  val interval = i.getIntExtra("interval", 500)

                  Notif.startFg(this, 2, "Analyzing $name", ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  Jobs.running = true
                  Jobs.cancel = false
                  Jobs.progress = 0f
                  Jobs.title = name
                  Jobs.message = ""
                  Jobs.startedAt = SystemClock.elapsedRealtime()

                  Thread {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      val wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "wizsync:analyze")
                      wl.acquire(6 * 60 * 60 * 1000L)
                      var lastNote = 0L
                      try {
                          val r = Analyzer.run(this, uri, interval) { p ->
                              Jobs.progress = p
                              val now = SystemClock.elapsedRealtime()
                              if (now - lastNote > 3000) {
                                  lastNote = now
                                  Notif.update(this, 2, "Analyzing $name: ${(p * 100).toInt()}%")
                              }
                          }
                          if (r != null) {
                              Tracks.save(this, name, interval, r.durationMs, r.data)
                              Jobs.libraryVersion++
                              Jobs.message = "Saved \"$name\". Open Saved tracks below to use it."
                          } else if (Jobs.cancel) {
                              Jobs.message = "Analysis cancelled."
                          } else {
                              Jobs.message = "This video can't be analyzed (HDR / 10-bit and some formats aren't supported yet)."
                          }
                      } catch (e: Exception) {
                          Jobs.message = "Could not analyze this video: ${e.message}"
                      } finally {
                          try {
                              wl.release()
                          } catch (e: Exception) {
                          }
                          Jobs.running = false
                          stopSelf()
                      }
                  }.start()
                  return START_NOT_STICKY
              }
          }
