          package com.example.wizsync

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.IBinder
          import android.os.PowerManager
          import android.os.SystemClock

          /** Reads a video file in the background and saves its color track. */
          class AnalyzeService : Service() {

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, flags: Int, startId: Int): Int {
                  if (i == null || Jobs.running) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val uri = i.data
                  if (uri == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val name = i.getStringExtra("name") ?: "Video"
                  val interval = i.getIntExtra("interval", 500)

                  Notif.startFg(this, 2, "Analyzing $name", ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  Jobs.running = true
                  Jobs.cancel = false
                  Jobs.progress = 0f
                  Jobs.title = name
                  Jobs.message = ""
                  Jobs.startedAt = SystemClock.elapsedRealtime()

                  Thread {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      val wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "wizsync:analyze")
                      wl.acquire(6 * 60 * 60 * 1000L)
                      var lastNote = 0L
                      try {
                          val detect = Look.get(this, Look.K_DETECT) == 1
                          val sens = Look.get(this, Look.K_SENS)
                          val r = Analyzer.run(this, uri, interval, detect, sens) { p ->
                              Jobs.progress = p
                              val now = SystemClock.elapsedRealtime()
                              if (now - lastNote > 3000) {
                                  lastNote = now
                                  Notif.update(this, 2, "Analyzing $name: ${(p * 100).toInt()}%")
                              }
                          }
                          if (r != null) {
                              val id = Tracks.save(this, name, interval, r.durationMs, r.data)
                              if (r.cues.isNotEmpty()) Tracks.saveCues(this, id, r.cues)
                              Jobs.libraryVersion++
                              Jobs.message = "Saved \"$name\"." +
                                  (if (detect) " Found ${r.cues.size} lightning/blast moment(s). Review them under Effects and cues." else "") +
                                  " Open Saved tracks below to use it."
                          } else if (Jobs.cancel) {
                              Jobs.message = "Analysis cancelled."
                          } else {
                              Jobs.message = "This video can't be analyzed (HDR / 10-bit and some formats aren't supported yet)."
                          }
                      } catch (e: Exception) {
                          Jobs.message = "Could not analyze this video: ${e.message}"
                      } finally {
                          try {
                              wl.release()
                          } catch (e: Exception) {
                          }
                          Jobs.running = false
                          stopSelf()
                      }
                  }.start()
                  return START_NOT_STICKY
              }
          }
