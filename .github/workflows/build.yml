          package com.example.wizsync

          import android.content.Context
          import android.os.SystemClock
          import java.util.concurrent.Executors

          /** One light effect placed at a moment of a movie. */
          class Cue(val ms: Long, val kind: Int, val auto: Boolean)

          /** The effects the app can play, and the little "scripts" that make them. */
          object Fx {
              const val LIGHTNING = 1
              const val BLAST = 2
              const val ALARM = 3
              const val FIRE = 4
              const val HEART = 5
              const val SC_FIREPLACE = 11
              const val SC_PARTY = 12
              const val SC_OCEAN = 13

              /** Packed 0xRRGGBB, or W for the bulb's cool white LEDs (brightest, best for flashes). */
              const val W = -1

              val all = listOf(LIGHTNING, BLAST, ALARM, FIRE, HEART, SC_FIREPLACE, SC_PARTY, SC_OCEAN)

              fun name(k: Int): String = when (k) {
                  LIGHTNING -> "\u26A1 Lightning"
                  BLAST -> "\uD83D\uDCA5 Blast"
                  ALARM -> "\uD83D\uDEA8 Alarm"
                  FIRE -> "\uD83D\uDD25 Fire flicker"
                  HEART -> "\uD83D\uDC93 Heartbeat"
                  SC_FIREPLACE -> "Fireplace (WiZ scene)"
                  SC_PARTY -> "Party (WiZ scene)"
                  SC_OCEAN -> "Ocean (WiZ scene)"
                  else -> "Effect"
              }

              /** One moment of an effect. Even-numbered bulbs show a, odd-numbered bulbs show b. */
              class Step(
                  val ms: Int,
                  val a: Int,
                  val da: Int,
                  val b: Int = a,
                  val db: Int = da,
                  val scene: Int = 0
              )

              private fun rgb(r: Int, g: Int, b: Int): Int = (r shl 16) or (g shl 8) or b

              private fun rnd(n: Int): Int = (Math.random() * n).toInt()

              fun script(kind: Int, gentle: Boolean): List<Step> {
                  when (kind) {
                      LIGHTNING -> {
                          val dark = rgb(10, 14, 45)
                          val glow = rgb(140, 165, 255)
                          val dim = rgb(70, 90, 190)
                          return if (gentle) {
                              // at most two soft flashes per second
                              listOf(
                                  Step(110, W, 80), Step(380, glow, 40), Step(260, dim, 25),
                                  Step(130, W, 55), Step(400, dim, 25)
                              )
                          } else {
                              listOf(
                                  Step(60, W, 100), Step(70, dark, 10),
                                  Step(90, W, 100), Step(55, dark, 10),
                                  Step(50, W, 75),
                                  Step(140, glow, 45), Step(180, dim, 25)
                              )
                          }
                      }
                      BLAST -> return listOf(
                          Step(90, rgb(255, 215, 130), 100),
                          Step(120, rgb(255, 150, 30), 100),
                          Step(200, rgb(255, 90, 10), 85),
                          Step(300, rgb(210, 45, 5), 60),
                          Step(400, rgb(130, 20, 0), 40)
                      )
                      ALARM -> {
                          val red = rgb(255, 0, 0)
                          val blue = rgb(0, 40, 255)
                          val out = ArrayList<Step>()
                          for (i in 0 until 6) {
                              if (i % 2 == 0) out.add(Step(350, red, 100, blue, 100)) else out.add(Step(350, blue, 100, red, 100))
                          }
                          return out
                      }
                      FIRE -> {
                          val pal = intArrayOf(rgb(255, 100, 10), rgb(255, 140, 20), rgb(255, 60, 0), rgb(230, 80, 5))
                          val out = ArrayList<Step>()
                          var total = 0
                          while (total < 2800) {
                              val ms = if (gentle) 260 + rnd(200) else 90 + rnd(130)
                              out.add(Step(ms, pal[rnd(pal.size)], 55 + rnd(45)))
                              total += ms
                          }
                          return out
                      }
                      HEART -> {
                          val red = rgb(255, 15, 25)
                          val one = listOf(
                              Step(130, red, 100), Step(110, red, 30),
                              Step(130, red, 90), Step(520, rgb(120, 5, 10), 20)
                          )
                          return one + one
                      }
                      SC_FIREPLACE -> return listOf(Step(ms = 6000, a = W, da = 100, scene = 5))
                      SC_PARTY -> return listOf(Step(ms = 6000, a = W, da = 100, scene = 4))
                      SC_OCEAN -> return listOf(Step(ms = 6000, a = W, da = 100, scene = 1))
                  }
                  return emptyList()
              }

              fun json(color: Int, dim: Int, p: LookParams): String {
                  val d = dim.coerceIn(10, 100)
                  if (color == W) {
                      return """{"method":"setPilot","params":{"state":true,"temp":6500,"dimming":$d}}"""
                  }
                  val r = (((color shr 16) and 0xFF) * p.gainR).toInt().coerceIn(0, 255)
                  val g = (((color shr 8) and 0xFF) * p.gainG).toInt().coerceIn(0, 255)
                  val b = ((color and 0xFF) * p.gainB).toInt().coerceIn(0, 255)
                  return """{"method":"setPilot","params":{"state":true,"r":$r,"g":$g,"b":$b,"dimming":$d}}"""
              }
          }

          /** Plays effects on the bulbs, one at a time, on a background thread. */
          object Effects {
              /** The movie-lights loop stays quiet until this time so it doesn't fight an effect. */
              @Volatile
              var busyUntil = 0L

              private val exec = Executors.newSingleThreadExecutor { r ->
                  val t = Thread(r)
                  t.isDaemon = true
                  t
              }

              /** shared = the sender the caller already has; null = use the bulbs found earlier. */
              fun fire(ctx: Context, kind: Int, shared: Sender?) {
                  val app = ctx.applicationContext
                  val steps = Fx.script(kind, Look.get(app, Look.K_GENTLE) == 1)
                  if (steps.isEmpty()) return
                  var total = 0
                  for (st in steps) total += st.ms
                  busyUntil = maxOf(busyUntil, SystemClock.elapsedRealtime()) + total + 150L

                  exec.execute {
                      var own: Sender? = null
                      try {
                          val s: Sender
                          if (shared != null) {
                              s = shared
                          } else {
                              val tmp = Sender(app)
                              tmp.refresh()
                              own = tmp
                              s = tmp
                          }
                          for (st in steps) {
                              if (st.scene > 0) s.sendScene(st.scene) else s.sendSplit(st.a, st.da, st.b, st.db)
                              Thread.sleep(st.ms.toLong())
                          }
                      } catch (e: Exception) {
                      } finally {
                          own?.close()
                      }
                  }
              }
          }

          /** The list of cues for the loaded track. Changes are saved next to the track. */
          object CueBook {
              fun set(list: List<Cue>) {
                  Player.cues = list.sortedBy { it.ms }
                  Player.cueVersion++
              }

              private fun persist(ctx: Context) {
                  val t = Player.track ?: return
                  Tracks.saveCues(ctx, t.id, Player.cues)
              }

              fun add(ctx: Context, c: Cue) {
                  set(Player.cues + c)
                  persist(ctx)
              }

              fun remove(ctx: Context, c: Cue) {
                  set(Player.cues.filter { it !== c })
                  persist(ctx)
              }

              fun clearAuto(ctx: Context) {
                  set(Player.cues.filter { !it.auto })
                  persist(ctx)
              }
          }
