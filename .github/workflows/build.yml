          package com.example.wizsync

          import android.content.Context
          import android.graphics.Color
          import android.graphics.ImageFormat
          import android.media.Image
          import android.media.MediaCodec
          import android.media.MediaCodecInfo
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.net.Uri
          import java.io.ByteArrayOutputStream

          /** Spots short bright flashes (lightning, explosions) in a stream of per-frame brightness values. */
          class FlashDetector(sens: Int) {
              // How much brighter than the usual level a frame must be (in brightness units). Higher sensitivity = smaller.
              private val minRise = 75f - 0.5f * sens.coerceIn(1, 100)
              private var base = -1f
              private var pending = false
              private var pStart = 0L
              private var pBase = 0f
              private var pPeak = 0f
              private var pr = 0f
              private var pg = 0f
              private var pb = 0f
              private var lastEnd = -10_000_000L
              val cues = ArrayList<Cue>()

              fun feed(ptsUs: Long, y: Float, r: Float, g: Float, b: Float) {
                  if (base < 0f) {
                      base = y
                      return
                  }
                  if (!pending) {
                      if (y - base >= minRise && y >= base * 1.8f + 8f && ptsUs - lastEnd > 1_500_000L) {
                          pending = true
                          pStart = ptsUs
                          pBase = base
                          pPeak = y
                          pr = r
                          pg = g
                          pb = b
                      } else {
                          base += (y - base) * 0.04f
                      }
                  } else {
                      if (y > pPeak) {
                          pPeak = y
                          pr = r
                          pg = g
                          pb = b
                      }
                      val dur = ptsUs - pStart
                      if (y <= pBase + 0.4f * (pPeak - pBase)) {
                          // The picture fell back to normal quickly: that was a flash, not a scene change.
                          if (dur <= 800_000L) cues.add(Cue(pStart / 1000L, kindOf(), true))
                          pending = false
                          lastEnd = ptsUs
                          base = pBase
                      } else if (dur > 800_000L) {
                          // It stayed bright: a cut or a lighting change, not a flash.
                          pending = false
                          lastEnd = ptsUs
                          base = y
                      }
                  }
              }

              // White or blue flashes are lightning, warm ones are explosions.
              private fun kindOf(): Int {
                  val hsv = FloatArray(3)
                  Color.RGBToHSV(
                      pr.toInt().coerceIn(0, 255),
                      pg.toInt().coerceIn(0, 255),
                      pb.toInt().coerceIn(0, 255),
                      hsv
                  )
                  val warm = hsv[1] >= 0.30f && (hsv[0] < 70f || hsv[0] > 340f)
                  return if (warm) Fx.BLAST else Fx.LIGHTNING
              }
          }

          /** Reads sample points out of one decoded frame. */
          private class Px(img: Image) {
              private val crop = img.cropRect
              val cw = crop.width()
              val ch = crop.height()
              private val pY = img.planes[0]
              private val pU = img.planes[1]
              private val pV = img.planes[2]
              private val bY = pY.buffer
              private val bU = pU.buffer
              private val bV = pV.buffer

              /** Reads grid point (i, j) of a gx by gy grid. out = [luma, r, g, b]. */
              fun read(i: Int, j: Int, gx: Int, gy: Int, out: IntArray) {
                  val y = crop.top + (j * ch + ch / 2) / gy
                  val x = crop.left + (i * cw + cw / 2) / gx
                  val yy = bY.get(minOf(y * pY.rowStride + x * pY.pixelStride, bY.limit() - 1)).toInt() and 0xFF
                  val uu = bU.get(minOf((y / 2) * pU.rowStride + (x / 2) * pU.pixelStride, bU.limit() - 1)).toInt() and 0xFF
                  val vv = bV.get(minOf((y / 2) * pV.rowStride + (x / 2) * pV.pixelStride, bV.limit() - 1)).toInt() and 0xFF
                  val c = 1.164f * (yy - 16)
                  val d = uu - 128
                  val e = vv - 128
                  out[0] = yy
                  out[1] = (c + 1.793f * e).toInt().coerceIn(0, 255)
                  out[2] = (c - 0.213f * d - 0.533f * e).toInt().coerceIn(0, 255)
                  out[3] = (c + 2.112f * d).toInt().coerceIn(0, 255)
              }
          }

          /** Decodes a video file from start to end and records its scene color every few hundred milliseconds. */
          object Analyzer {
              class Result(val data: ByteArray, val durationMs: Long, val cues: List<Cue>)

              fun run(
                  ctx: Context,
                  uri: Uri,
                  intervalMs: Int,
                  detect: Boolean,
                  sens: Int,
                  onProgress: (Float) -> Unit
              ): Result? {
                  val ex = MediaExtractor()
                  var codec: MediaCodec? = null
                  try {
                      ex.setDataSource(ctx, uri, null)
                      var vi = -1
                      for (i in 0 until ex.trackCount) {
                          val m = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME)
                          if (m != null && m.startsWith("video/")) {
                              vi = i
                              break
                          }
                      }
                      if (vi < 0) return null
                      ex.selectTrack(vi)
                      val fmt = ex.getTrackFormat(vi)
                      val mime = fmt.getString(MediaFormat.KEY_MIME) ?: return null
                      val durUs = if (fmt.containsKey(MediaFormat.KEY_DURATION)) fmt.getLong(MediaFormat.KEY_DURATION) else 0L
                      fmt.setInteger(
                          MediaFormat.KEY_COLOR_FORMAT,
                          MediaCodecInfo.CodecCapabilities.COLOR_FormatYUV420Flexible
                      )

                      val c = MediaCodec.createDecoderByType(mime)
                      codec = c
                      c.configure(fmt, null, null, 0)
                      c.start()

                      val info = MediaCodec.BufferInfo()
                      val intervalUs = intervalMs * 1000L
                      val acc = Accum()
                      val det = FlashDetector(sens)
                      val tmp = IntArray(4)
                      val out = ByteArrayOutputStream()
                      var nextUs = 0L
                      var inDone = false
                      var outDone = false
                      var failed = false
                      var idle = 0

                      while (!outDone && !Jobs.cancel) {
                          if (!inDone) {
                              val ii = c.dequeueInputBuffer(10_000)
                              if (ii >= 0) {
                                  val buf = c.getInputBuffer(ii)
                                  val n = if (buf != null) ex.readSampleData(buf, 0) else -1
                                  if (n < 0) {
                                      c.queueInputBuffer(ii, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                                      inDone = true
                                  } else {
                                      c.queueInputBuffer(ii, 0, n, ex.sampleTime, 0)
                                      ex.advance()
                                  }
                              }
                          }

                          val oi = c.dequeueOutputBuffer(info, 10_000)
                          if (oi >= 0) {
                              idle = 0
                              val pts = info.presentationTimeUs
                              val sampleDue = pts >= nextUs
                              if (info.size > 0 && (detect || sampleDue)) {
                                  val img = c.getOutputImage(oi)
                                  if (img == null || img.format != ImageFormat.YUV_420_888) {
                                      failed = true
                                      outDone = true
                                  } else {
                                      val px = Px(img)
                                      if (px.cw > 0 && px.ch > 0) {
                                          if (detect) {
                                              // Every frame: average brightness and color on a small grid.
                                              var sy = 0f
                                              var sr = 0f
                                              var sg = 0f
                                              var sb = 0f
                                              for (j in 0 until 18) {
                                                  for (i in 0 until 32) {
                                                      px.read(i, j, 32, 18, tmp)
                                                      sy += tmp[0]
                                                      sr += tmp[1]
                                                      sg += tmp[2]
                                                      sb += tmp[3]
                                                  }
                                              }
                                              val n = 576f
                                              det.feed(pts, sy / n, sr / n, sg / n, sb / n)
                                          }
                                          if (sampleDue) {
                                              // Once per slot: the scene color, on a finer grid.
                                              acc.reset()
                                              for (j in 0 until 36) {
                                                  for (i in 0 until 64) {
                                                      px.read(i, j, 64, 36, tmp)
                                                      acc.add(tmp[1], tmp[2], tmp[3])
                                                  }
                                              }
                                              val s = acc.result()
                                              // One slot per interval; a frame covers every slot up to its own time.
                                              while (nextUs <= pts) {
                                                  out.write(s[0])
                                                  out.write(s[1])
                                                  out.write(s[2])
                                                  out.write(s[3])
                                                  nextUs += intervalUs
                                              }
                                              if (durUs > 0) {
                                                  onProgress((pts.toFloat() / durUs).coerceIn(0f, 1f))
                                              }
                                          }
                                      }
                                  }
                                  if (img != null) img.close()
                              }
                              c.releaseOutputBuffer(oi, false)
                              if ((info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) outDone = true
                          } else if (inDone) {
                              idle++
                              if (idle > 500) outDone = true
                          }
                      }

                      if (Jobs.cancel || failed || out.size() == 0) return null
                      val dMs = maxOf(durUs / 1000, (out.size() / 4).toLong() * intervalMs)
                      return Result(out.toByteArray(), dMs, det.cues)
                  } finally {
                      try {
                          codec?.stop()
                      } catch (e: Exception) {
                      }
                      try {
                          codec?.release()
                      } catch (e: Exception) {
                      }
                      ex.release()
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/wizsync/SyncService.kt <<'EOF'
          package com.example.wizsync

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.SystemClock

          /** Live sync: mirrors whatever is on this screen onto the bulbs. */
          class SyncService : Service() {

              private var projection: MediaProjection? = null
              private var display: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var sender: Sender? = null
              private var thread: HandlerThread? = null

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, flags: Int, startId: Int): Int {
                  val data = i?.getParcelableExtra<Intent>("data")
                  if (i == null || data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  Notif.startFg(this, 1, "Starting...", ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)

                  val t = HandlerThread("wiz-sync").also { it.start() }
                  thread = t
                  val h = Handler(t.looper)

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mpm.getMediaProjection(i.getIntExtra("code", 0), data).also {
                      it.registerCallback(object : MediaProjection.Callback() {
                          override fun onStop() {
                              stopSelf()
                          }
                      }, h)
                  }
                  h.post { begin(h) }
                  return START_NOT_STICKY
              }

              // Runs on the worker thread: find bulbs, then start grabbing frames.
              private fun begin(h: Handler) {
                  val s = Sender(this)
                  sender = s
                  val n = s.refresh()
                  Notif.update(this, 1, "Syncing $n of ${s.total()} bulb(s)")

                  val dm = resources.displayMetrics
                  val w = 96
                  val hh = (w.toFloat() * dm.heightPixels / dm.widthPixels).toInt().coerceAtLeast(8)
                  val rd = ImageReader.newInstance(w, hh, PixelFormat.RGBA_8888, 2)
                  reader = rd

                  val acc = Accum()
                  var sr = -1f
                  var sg = 0f
                  var sb = 0f
                  var sv = -1f
                  var last = 0L

                  rd.setOnImageAvailableListener({ r ->
                      val img = r.acquireLatestImage() ?: return@setOnImageAvailableListener
                      try {
                          val now = SystemClock.uptimeMillis()
                          if (now - last < 100) return@setOnImageAvailableListener // ~10 updates/sec
                          last = now

                          val p = img.planes[0]
                          val buf = p.buffer
                          acc.reset()
                          for (y in 0 until hh) {
                              for (x in 0 until w) {
                                  val o = y * p.rowStride + x * p.pixelStride
                                  acc.add(
                                      buf.get(o).toInt() and 0xFF,
                                      buf.get(o + 1).toInt() and 0xFF,
                                      buf.get(o + 2).toInt() and 0xFF
                                  )
                              }
                          }
                          val res = acc.result()

                          // A frame with no usable color keeps the previous color.
                          if (res[0] != 0 || res[1] != 0 || res[2] != 0) {
                              val cr = res[0].toFloat()
                              val cg = res[1].toFloat()
                              val cb = res[2].toFloat()
                              if (sr < 0) {
                                  sr = cr
                                  sg = cg
                                  sb = cb
                              } else {
                                  sr += (cr - sr) * 0.5f
                                  sg += (cg - sg) * 0.5f
                                  sb += (cb - sb) * 0.5f
                              }
                          }
                          val av = res[3] / 255f
                          sv = if (sv < 0) av else sv + (av - sv) * 0.5f
                          if (sr >= 0) s.send(sr, sg, sb, sv)
                      } finally {
                          img.close()
                      }
                  }, h)

                  display = projection?.createVirtualDisplay(
                      "wiz-sync", w, hh, dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, rd.surface, null, h
                  )
              }

              override fun onDestroy() {
                  display?.release()
                  reader?.close()
                  projection?.stop()
                  sender?.close()
                  thread?.quitSafely()
                  super.onDestroy()
              }
          }
          EOF

