          cat > app/src/main/java/com/example/wizsync/PlayService.kt <<'EOF'
          package com.example.wizsync

          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.SystemClock

          /** Movie lights: plays a saved color track onto the bulbs, following the clock in Player. */
          class PlayService : Service() {

              companion object {
                  @Volatile
                  var running = false
              }

              private var thread: HandlerThread? = null
              private var handler: Handler? = null
              private var sender: Sender? = null
              private val buf = FloatArray(4)
              private var lastP = -1L
              private var tickN = 0

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, flags: Int, startId: Int): Int {
                  Notif.startFg(this, 3, "Movie lights ready", ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                  if (running) return START_NOT_STICKY
                  running = true

                  val t = HandlerThread("wiz-play").also { it.start() }
                  thread = t
                  val h = Handler(t.looper)
                  handler = h
                  h.post {
                      val s = Sender(this)
                      sender = s
                      val n = s.refresh()
                      Notif.update(this, 3, "Movie lights: $n of ${s.total()} bulb(s)")
                      tick(h, s)
                  }
                  return START_NOT_STICKY
              }

              private fun tick(h: Handler, s: Sender) {
                  if (!running) return
                  val t = Player.track
                  if (t != null && Player.playing) {
                      val pos = Player.position()
                      if (pos >= t.durationMs) {
                          Player.pause()
                          lastP = -1L
                      } else {
                          // Effects fire a little early to make up for network and bulb delay.
                          val p = pos + 80L
                          if (lastP < 0L || p < lastP || p - lastP > 400L) {
                              // first tick, or the position jumped (seek): don't fire cues we skipped over
                              lastP = p
                          } else {
                              for (c in Player.cues) {
                                  if (c.ms > lastP && c.ms <= p) Effects.fire(this, c.kind, s)
                              }
                              lastP = p
                          }

                          // Colors go out every other tick (10 per second), and not while an effect is playing.
                          tickN++
                          if (tickN % 2 == 0 && SystemClock.elapsedRealtime() >= Effects.busyUntil) {
                              t.colorAt(pos, buf)
                              s.send(buf[0], buf[1], buf[2], buf[3] / 255f)
                          }
                      }
                  } else {
                      lastP = -1L
                  }
                  h.postDelayed({ tick(h, s) }, 50)
              }

              override fun onDestroy() {
                  running = false
                  handler?.removeCallbacksAndMessages(null)
                  sender?.close()
                  thread?.quitSafely()
                  super.onDestroy()
              }
          }
