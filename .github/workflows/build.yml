          cat > app/src/main/java/com/example/wizsync/Wiz.kt <<'EOF'
          package com.example.wizsync

          import android.content.Context
          import android.os.SystemClock
          import org.json.JSONObject
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import java.net.SocketTimeoutException

          data class Bulb(
              val ip: String,
              val mac: String,
              val model: String,
              val fw: String,
              val on: Boolean?,
              val rssi: Int?
          ) {
              // Stable id used to remember which bulbs are switched off for sync.
              val key: String get() = mac.ifEmpty { ip }
          }

          object Wiz {
              const val PORT = 38899

              // If auto-discovery misses a bulb, add its IP here, e.g. listOf("192.168.1.50", "192.168.1.51")
              val manualIps = listOf<String>()

              /** Finds every WiZ bulb on the Wi-Fi and asks each one for its details. Blocks for a few seconds. */
              fun discover(waitMs: Long = 2500): List<Bulb> {
                  val ips = linkedSetOf<String>()
                  val s = DatagramSocket()
                  try {
                      s.broadcast = true
                      s.soTimeout = 400
                      val msg =
                          """{"method":"registration","params":{"phoneMac":"AAAAAAAAAAAA","register":false,"phoneIp":"1.2.3.4","id":"1"}}"""
                              .toByteArray()
                      try {
                          val bc = InetAddress.getByName("255.255.255.255")
                          repeat(3) { s.send(DatagramPacket(msg, msg.size, bc, PORT)) }
                      } catch (e: Exception) {
                      }
                      val end = SystemClock.uptimeMillis() + waitMs
                      val buf = ByteArray(2048)
                      while (SystemClock.uptimeMillis() < end) {
                          try {
                              val p = DatagramPacket(buf, buf.size)
                              s.receive(p)
                              val ip = p.address.hostAddress
                              if (ip != null) ips.add(ip)
                          } catch (e: SocketTimeoutException) {
                          } catch (e: Exception) {
                              break
                          }
                      }
                  } catch (e: Exception) {
                  } finally {
                      s.close()
                  }
                  ips.addAll(manualIps)
                  return ips.map { details(it) }
                      .sortedBy { it.ip.substringAfterLast('.').toIntOrNull() ?: 0 }
              }

              private fun details(ip: String): Bulb {
                  val cfg = ask(ip, "getSystemConfig")
                  val pilot = ask(ip, "getPilot")
                  val mac = cfg?.optString("mac").orEmpty()
                      .ifEmpty { pilot?.optString("mac").orEmpty() }
                      .lowercase()
                  return Bulb(
                      ip = ip,
                      mac = mac,
                      model = cfg?.optString("moduleName").orEmpty(),
                      fw = cfg?.optString("fwVersion").orEmpty(),
                      on = if (pilot != null && pilot.has("state")) pilot.optBoolean("state") else null,
                      rssi = if (pilot != null && pilot.has("rssi")) pilot.optInt("rssi") else null
                  )
              }

              private fun ask(ip: String, method: String): JSONObject? {
                  val s = DatagramSocket()
                  try {
                      s.soTimeout = 600
                      val addr = InetAddress.getByName(ip)
                      val msg = """{"method":"$method","params":{}}""".toByteArray()
                      val buf = ByteArray(2048)
                      for (attempt in 1..2) {
                          s.send(DatagramPacket(msg, msg.size, addr, PORT))
                          try {
                              val p = DatagramPacket(buf, buf.size)
                              s.receive(p)
                              return JSONObject(String(p.data, 0, p.length)).optJSONObject("result")
                          } catch (e: SocketTimeoutException) {
                          }
                      }
                  } catch (e: Exception) {
                  } finally {
                      s.close()
                  }
                  return null
              }

              /** Flashes one bulb so you can tell which physical bulb it is. endOn = state to leave it in. */
              fun blink(ip: String, endOn: Boolean) {
                  val s = DatagramSocket()
                  try {
                      val addr = InetAddress.getByName(ip)
                      val first = !endOn
                      repeat(3) {
                          for (state in listOf(first, !first)) {
                              val m = """{"method":"setPilot","params":{"state":$state}}""".toByteArray()
                              s.send(DatagramPacket(m, m.size, addr, PORT))
                              Thread.sleep(350)
                          }
                      }
                  } catch (e: Exception) {
                  } finally {
                      s.close()
                  }
              }

              // ---- which bulbs are switched off for sync (saved on the device) ----

              fun disabled(ctx: Context): Set<String> =
                  ctx.getSharedPreferences("wiz", Context.MODE_PRIVATE).getStringSet("off", null) ?: emptySet()

              fun setEnabled(ctx: Context, key: String, enabled: Boolean) {
                  val set = HashSet(disabled(ctx))
                  if (enabled) set.remove(key) else set.add(key)
                  ctx.getSharedPreferences("wiz", Context.MODE_PRIVATE).edit().putStringSet("off", set).apply()
              }
          }
